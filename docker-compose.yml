services:
  stitch-api:
    build: .
    image: grain-stitch-service:latest
    # 宿主机端口用环境变量 API_HOST_PORT 配置（默认 8080）；
    # 容器内监听端口可用 API_PORT 覆盖（默认 8080，两侧映射自动联动）。
    ports:
      - "${API_HOST_PORT:-8080}:${API_PORT:-8080}"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "${API_PORT:-8080}"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request,sys; port=os.environ.get('API_PORT','8080'); resp=urllib.request.urlopen('http://127.0.0.1:'+port+'/healthz', timeout=2); sys.exit(0 if json.load(resp).get('status')=='ok' else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3
    restart: unless-stopped
